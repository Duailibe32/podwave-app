    <script>
      // In cloud sandbox / reverse proxy environments where HMR is disabled,
      // shim Vite HMR WebSocket to prevent 'WebSocket closed without opened' errors.
      (function() {
        var _RealWebSocket = window.WebSocket;
        if (_RealWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = typeof url === 'string' && (protocols === 'vite-hmr' || url.includes('token=') || url.includes('24678') || url.includes('5173'));
            if (isViteHmr) {
              var listeners = {};
              return {
                readyState: 1, // OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                url: url,
                protocol: protocols || '',
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(fn, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {}
              };
            }
            return new _RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = _RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error && event.error.message));
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('vite'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var msg = event && event.reason && (event.reason.message || event.reason.toString());
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('vite'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        var _origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments.length > 0 ? arguments[0] : '';
          var str = typeof firstArg === 'string' ? firstArg : (firstArg && firstArg.message ? firstArg.message : '');
          if (str && (str.includes('[vite]') || str.includes('WebSocket closed without opened') || str.includes('failed to connect to websocket'))) {
            return;
          }
          _origConsoleError.apply(console, arguments);
        };
      })();
    </script>
